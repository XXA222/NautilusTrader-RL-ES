[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "rles-compute-runtime"
version = "0.4.1"
requires-python = ">=3.14,<3.15"
description = "Nautilus-RLES L6 CPU/GPU resource and worker runtime"
dependencies = ["rles-contracts>=0.4.0.dev0,<0.5.0"]
[project.entry-points."nautilus_rles.compute"]
local = "rles_compute_runtime.provider:provider"
[tool.hatch.build.targets.wheel]
packages = ["src/rles_compute_runtime"]
