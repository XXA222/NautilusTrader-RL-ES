[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "rles-nautilus-adapter"
version = "0.4.0.dev2"
description = "L3 Nautilus-RLES nautilus_adapter independent module"
requires-python = "==3.14.7"
dependencies = [
  "rles-contracts>=0.4.0.dev0,<0.5.0",
  "nautilus_trader==2.0.0rc6"
]

[tool.hatch.build.targets.wheel]
packages = ["src/rles_nautilus_adapter"]

[project.entry-points."nautilus_rles.engine"]
nt_rc6 = "rles_nautilus_adapter:provider"
